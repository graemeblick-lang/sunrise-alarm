plugins {
    id "com.android.application"
}

android {
    namespace "au.sunrise.alarm"
    compileSdk 34

    defaultConfig {
        applicationId "au.sunrise.alarm"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
        // Your Spotify developer app's Client ID (not a secret), from the SPOTIFY_CLIENT_ID GitHub variable.
        // Lets the app start a chosen playlist in Spotify. Empty = Spotify still works, playing what you last played.
        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"" + (System.getenv("SPOTIFY_CLIENT_ID") ?: "").replaceAll("[^A-Za-z0-9]", "") + "\""
    }

    signingConfigs {
        release {
            // The workflow creates this keystore once and stores it in a private GitHub secret,
            // so every build is signed the same way and updates install over the top.
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias "sunrise"
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // The web app (index.html and friends at the top of the repo) is built into the APK,
    // so the app never needs the website: it works with no internet and can't be changed from outside.
    sourceSets {
        main {
            assets.srcDir(new File(project.buildDir, "generated/www-assets"))
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Spotify's official App Remote SDK (from github.com/spotify/android-sdk, Apache 2.0)
    implementation files("libs/spotify-app-remote-release-0.8.0.aar")
    implementation "com.google.code.gson:gson:2.10.1"
}

def webAppDir = rootProject.projectDir.parentFile
tasks.register("copyWebApp", Copy) {
    from(webAppDir) {
        include "index.html", "manifest.webmanifest", "fonts.css", "fonts/**",
                "icon-192.png", "icon-512.png", "icon-maskable-512.png"
    }
    into new File(project.buildDir, "generated/www-assets/www")
}
tasks.named("preBuild") { dependsOn "copyWebApp" }
