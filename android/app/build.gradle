plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "au.sunrise.alarm"
    compileSdk 34

    defaultConfig {
        applicationId "au.sunrise.alarm"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
        // Your Spotify developer app's Client ID (not a secret), from the SPOTIFY_CLIENT_ID GitHub variable.
        // Lets the app start a chosen playlist in Spotify. Empty = Spotify still works, playing what you last played.
        // Spotify's sign-in library returns to Sunrise on this address (au.sunrise.alarm://spotify-callback)
        manifestPlaceholders = [redirectSchemeName: "au.sunrise.alarm", redirectHostName: "spotify-callback"]
        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"" + (System.getenv("SPOTIFY_CLIENT_ID") ?: "").replaceAll("[^A-Za-z0-9]", "") + "\""
    }

    signingConfigs {
        release {
            // The workflow creates this keystore once and stores it in a private GitHub secret,
            // so every build is signed the same way and updates install over the top.
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias "sunrise"
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // Screen tests run on the computer (Robolectric), with the app's resources
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "2g"
                // A stuck screen test fails in minutes instead of holding up the build
                timeout.set(java.time.Duration.ofMinutes(10))
            }
        }
    }

    buildFeatures {
        buildConfig true
        compose true      // native settings screens (Jetpack Compose, Material 3)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Spotify's official App Remote SDK (from github.com/spotify/android-sdk, Apache 2.0)
    implementation files("libs/spotify-app-remote-release-0.8.0.aar")
    // Spotify's sign-in library (Maven Central): shows Spotify's "Agree" screen from Sunrise itself. Android won't let the
    // Spotify app pop up its own permission screen for another app (App Remote's showAuthView just waits forever)
    implementation "com.spotify.android:auth:2.1.1"
    implementation "com.google.code.gson:gson:2.10.1"

    // Native settings screens: Jetpack Compose with Material 3
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.13.1"

    testImplementation "junit:junit:4.13.2"
    // Screen tests: Compose's test rules, run on the computer by Robolectric (no phone or emulator needed)
    testImplementation platform("androidx.compose:compose-bom:2024.10.01")
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation "androidx.test:core:1.6.1"      // ActivityScenario: opens the real alarm screens in tests
    testImplementation "org.robolectric:robolectric:4.13"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    // Unit tests run against a stubbed android.jar whose org.json methods only throw "not mocked":
    // give them the real JSON library, which comes first on the test classpath
    testImplementation "org.json:json:20240303"
}
