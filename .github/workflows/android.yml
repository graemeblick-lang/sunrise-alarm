name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "index.html", "tests/**"]
  # Pull requests build and test too, but don't publish
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "index.html", "tests/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the alarm schedule
        run: |
          # Run in two time zones, one with daylight saving, to catch date maths mistakes
          TZ=Australia/Melbourne node tests/schedule.test.js
          TZ=UTC node tests/schedule.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Preferred: the keystore itself lives in a private secret (KEYSTORE_BASE64), not in the repo.
          # Otherwise the keystore file in the repo is used, locked with a password that only lives in a secret.
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_PASSWORD" ]; then
            cp android/release.jks android/app/release.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android/app/release.jks -alias sunrise -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Sunrise Alarm"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_PASSWORD secret not set, so this build uses a one-off key. Uninstall the old app before installing it."
          fi

      - name: Bundle an offline copy of the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Keep the APK from this build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SunriseAlarm-test-build
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SunriseAlarm.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SunriseAlarm.apk \
            --title "Sunrise Alarm for Android" \
            --notes "On your phone, tap SunriseAlarm.apk below to download it, then open it to install." \
            --latest
